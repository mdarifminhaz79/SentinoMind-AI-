<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Automate | Login</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="gradient-bg">
        <div class="gradient-1"></div>
        <div class="gradient-2"></div>
        <div class="gradient-3"></div>
    </div>

    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-card glass-morphism">
            <div class="login-header">
                <div class="logo-wrapper">
                    <div class="logo-glow">
                        <i class="fas fa-robot"></i>
                    </div>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to continue to your dashboard</p>
            </div>

            <div class="social-login">
                <button class="social-btn google" onclick="handleSocialLogin('gmail')">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn facebook" onclick="handleSocialLogin('facebook')">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </button>
            </div>

            <div class="divider">
                <span>or continue with email</span>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper glass-morphism">
                        <i class="far fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" value="demo@example.com">
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper glass-morphism">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" value="password123">
                        <i class="far fa-eye toggle-password" onclick="togglePassword()"></i>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#" onclick="showForgotPassword()">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn glow-btn" id="loginBtn">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="signup-link">
                <p>Don't have an account? <a href="#" onclick="showSignUp()">Create account</a></p>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
