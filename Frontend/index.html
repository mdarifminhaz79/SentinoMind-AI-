<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinoMind AI | Neural Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <!-- Animated Background -->
    <div class="neural-bg">
        <div class="gradient-orb orb1"></div>
        <div class="gradient-orb orb2"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="login-container">
        <div class="login-card glass-card">

            <div class="brand">
                <div class="logo-wrapper">
                    <i class="fas fa-brain"></i>
                </div>
                <h1>SentinoMind<span class="ai-badge">AI</span></h1>
                <p class="neural-text">Initialize Neural Session</p>
            </div>

            <form id="loginForm" class="neural-form">

                <div class="input-group floating-label">
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email">Gmail Address</label>
                    <i class="fas fa-envelope input-icon"></i>
                </div>

                <div class="input-group floating-label">
                    <input type="password" id="password" required placeholder=" ">
                    <label for="password">Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="far fa-eye"></i>
                    </button>
                </div>

                <div class="remember-forgot">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span>
                        <span class="remember-text">Remember session</span>
                    </label>
                    <a href="#" class="forgot-link" id="forgotPassword">
                        <i class="fas fa-shield-alt"></i> Forgot password?
                    </a>
                </div>

                <button type="submit" class="login-btn neural-glow" id="loginBtn">
                    <span>Access Neural Core</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="security-badge">
                    <i class="fas fa-lock"></i>
                    <span>Neural encryption active</span>
                </div>

            </form>

            <!-- SINGLE SIGNUP PROMPT - Using BUTTON version -->
            <div class="signup-prompt">
                <p>New to the network?</p>
                <button id="createAccountBtn" class="neural-button">
                    <i class="fas fa-plus-circle"></i>
                    <span>Create Neural Profile</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <div class="neural-status">
                <div class="status-dot"></div>
                <span>Neural Grid: Online</span>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toast"></div>

    <script src="login.js"></script>
</body>
</html>
